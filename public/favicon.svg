  <!-- Roof Accent -->
  <path d="M 256 100 L 396 210 L 368 210 L 256 122 L 144 210 L 116 210 Z" fill="url(#roofGrad)"/>
  
  <!-- Chimney / Sun / Gold Accent -->
  <circle cx="340" cy="140" r="24" fill="url(#accentGrad)"/>

  <!-- Window & Door Details -->
  <rect x="224" y="240" rx="6" width="64" height="90" fill="#0f172a"/>
  <rect x="180" y="220" rx="4" width="32" height="32" fill="url(#roofGrad)"/>
  <rect x="300" y="220" rx="4" width="32" height="32" fill="url(#roofGrad)"/>
